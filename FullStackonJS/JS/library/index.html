<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>📚 My Library</h1>
        <button id="new-book-btn" class="primary-btn">+ Add New Book</button>
    </header>

    <main id="library-container" class="book-grid"></main>

    <dialog id="book-dialog">
        <form id="book-form">
            <h2>Add a New Book</h2>
            
            <div class="form-group">
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" required>
            </div>
            
            <div class="form-group">
                <label for="author">Author:</label>
                <input type="text" id="author" name="author" required>
            </div>
            
            <div class="form-group">
                <label for="pages">Pages:</label>
                <input type="number" id="pages" name="pages" min="1" required>
            </div>
            
            <div class="form-group checkbox-group">
                <input type="checkbox" id="read" name="read">
                <label for="read">I have read this book</label>
            </div>
            
            <div class="form-actions">
                <button type="button" id="close-dialog-btn" class="secondary-btn">Cancel</button>
                <button type="submit" class="primary-btn">Add to Library</button>
            </div>
        </form>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
