<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Matemasie&display=swap" rel="stylesheet">
    <title>A basic form</title>
</head>

<body>

    <div class="leftPart">
        <div class="logoL">
            <div class="logo">
                <img alt="Company Logo" src="images/logo.jpg">
                <p>Kitkat</p>
            </div>
        </div>

        <a href="https://in.pinterest.com/trendysphere24/">Bg source</a>

    </div>

    <div class="rightPart">
        <h2>Join our wonderful membership group to avail most exclusive and membership limited opportunities! Join now
            by signing up!</h2>
        <h4>Sign up</h4>

        <form action="" method="post">
            <fieldset>
                <legend>Let's do this!</legend>

                <label for="first_name">First Name</label>
                <input type="text" id="first_name" placeholder="John" name="first_name" required>

                <label for="last_name">Last Name</label>
                <input type="text" id="last_name" placeholder="Snow" name="last_name" required>

                <label for="mail">Email</label>
                <input type="email" id="mail" placeholder="Johnsnow@odin.com" name="mail" required>

                <label for="ph">Phone Number</label>
                <input type="tel" id="ph" placeholder="+91 922XXX0X89" name="ph">

                <label for="pw">Password</label>
                <input type="password" id="pw" placeholder="password@10" name="pw" required>

                <label for="cpw">Confirm Password</label>
                <input type="password" id="cpw" placeholder="password@10" name="cpw" required>

                <button type="submit">Create Account</button>
                <button type="reset">Reset</button>
            </fieldset>
        </form>
    </div>

</body>

</html>
